# Runs the Go tests, then builds the five SSOReady images, scans them, and
# publishes them to Docker Hub as omnifact/ssoready-<name>:<tag>.
#
# The tag is the commit time in UTC plus the short commit sha, for example
# 20261111.111838-808a1a6. The time makes tags sortable, so Renovate in the
# Omnifact repo can tell which build is newest; the sha says what was built.
#
# - Pull requests and manual runs: test, build and scan only.
# - Pushes to main: test, build, scan, then push. Only reviewed code on main is
#   published. The push runs in the "dockerhub" environment, which holds the
#   Docker Hub secrets and only allows main, so a branch cannot reach them even
#   with a changed copy of this workflow.
#
# The scan fails on any critical or high vulnerability that has a fix, so an
# image with known, fixable issues is never published. Base images are pinned
# by digest and kept current by Dependabot (.github/dependabot.yml); merging
# its PR rebuilds and republishes the images.
#
# Tags are never overwritten: a tag that already exists on Docker Hub is left
# as it is, because a deployment may already run it. Deploying a new tag is a
# separate step (imageTag in the Omnifact Pulumi config).
name: Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by digest. Update tag and digest together.
  POSTGRES_IMAGE: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  test:
    name: go test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Test with the same Go toolchain the images are built with: the build
      # stage of the api Dockerfile, which holds go.mod, cmd and internal.
      - name: Build test image
        run: docker build --platform linux/amd64 --target build -f ./cmd/api/Dockerfile -t ssoready-go-build .

      # Postgres for the store integration tests (internal/store). Same major
      # version as the Omnifact database server.
      - name: Start Postgres
        run: |
          docker network create test
          docker run -d --name postgres --network test -e POSTGRES_PASSWORD=password "$POSTGRES_IMAGE"
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -h localhost > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Postgres did not start" && docker logs postgres && exit 1

      - name: Test
        run: |
          docker run --rm --network test -e CGO_ENABLED=0 \
            -e SSOREADY_TEST_DATABASE_URL='postgres://postgres:password@postgres:5432/postgres?sslmode=disable' \
            ssoready-go-build go test ./...

  image:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: ./app
            file: ./app/Dockerfile
          - name: admin
            context: ./admin
            file: ./admin/Dockerfile
          - name: auth
            context: .
            file: ./cmd/auth/Dockerfile
          - name: api
            context: .
            file: ./cmd/api/Dockerfile
          - name: migrate
            context: .
            file: ./cmd/migrate/Dockerfile
    # Only publishing runs get the environment, so pull request runs never
    # wait for it or see its secrets.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'dockerhub' || '' }}
    env:
      IMAGE: omnifact/ssoready-${{ matrix.name }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Commit time, not run time: a rerun of the same commit gets the same tag.
      - name: Set tag
        run: |
          time=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d.%H%M%S HEAD)
          echo "TAG=$time-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --platform linux/amd64 --pull -f "${{ matrix.file }}" -t "$IMAGE:$TAG" "${{ matrix.context }}"

      - name: Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "$IMAGE:$TAG"

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$TAG already exists on Docker Hub, not overwriting it."
            exit 0
          fi
          docker push "$IMAGE:$TAG"
          echo "Pushed \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
