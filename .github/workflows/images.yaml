# Runs the Go tests, then builds the five SSOReady images, scans them, and
# publishes them to Docker Hub as omnifact/ssoready-<name>:<tag>.
#
# The tag is the commit time in UTC plus the short commit sha, for example
# 20261111.111838-808a1a6. The time makes tags sortable, so Renovate in the
# Omnifact repo can tell which build is newest; the sha says what was built.
#
# - Pull requests and manual runs: test, build and scan only.
# - Pushes to main: test, build, scan, then publish. Only reviewed code on main
#   is published. The publish job runs in the "dockerhub" environment, which
#   holds the Docker Hub secrets and only allows main, so a branch cannot reach
#   them even with a changed copy of this workflow.
#
# All five images or none: the image jobs only build and scan, and hand their
# images to the publish job, which runs only when all five passed. It pushes
# exactly the scanned images, migrate last. Renovate in the Omnifact repo looks
# up the migrate tag, so it never sees a build with images missing, even when
# a push fails halfway.
#
# The scan fails on any critical or high vulnerability that has a fix, so an
# image with known, fixable issues is never published. Base images are pinned
# by digest and kept current by Dependabot (.github/dependabot.yml); merging
# its PR rebuilds and republishes the images.
#
# Tags are never overwritten: a tag that already exists on Docker Hub is left
# as it is, because a deployment may already run it. Deploying a new tag is a
# separate step (imageTag in the Omnifact Pulumi config).
name: Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by digest. Update tag and digest together.
  POSTGRES_IMAGE: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  # Commit time, not run time: a rerun of the same commit gets the same tag.
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set tag
        id: tag
        run: |
          time=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d.%H%M%S HEAD)
          echo "tag=$time-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: go test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Test with the same Go toolchain the images are built with: the build
      # stage of the api Dockerfile, which holds go.mod, cmd and internal.
      - name: Build test image
        run: docker build --platform linux/amd64 --target build -f ./cmd/api/Dockerfile -t ssoready-go-build .

      # Postgres for the store integration tests (internal/store). Same major
      # version as the Omnifact database server.
      - name: Start Postgres
        run: |
          docker network create test
          docker run -d --name postgres --network test -e POSTGRES_PASSWORD=password "$POSTGRES_IMAGE"
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -h localhost > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Postgres did not start" && docker logs postgres && exit 1

      - name: Test
        run: |
          docker run --rm --network test -e CGO_ENABLED=0 \
            -e SSOREADY_TEST_DATABASE_URL='postgres://postgres:password@postgres:5432/postgres?sslmode=disable' \
            ssoready-go-build go test ./...

  image:
    name: ${{ matrix.name }}
    needs: [tag, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: ./app
            file: ./app/Dockerfile
            smoke-port: 8082
            smoke-env: -e APP_API_URL=http://api -e APP_APP_URL=http://app -e APP_PUBLIC_API_URL=http://public-api
          - name: admin
            context: ./admin
            file: ./admin/Dockerfile
            smoke-port: 8083
            smoke-env: -e ADMIN_API_URL=http://api
          - name: auth
            context: .
            file: ./cmd/auth/Dockerfile
          - name: api
            context: .
            file: ./cmd/api/Dockerfile
          - name: migrate
            context: .
            file: ./cmd/migrate/Dockerfile
    env:
      IMAGE: omnifact/ssoready-${{ matrix.name }}
      TAG: ${{ needs.tag.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build
        run: docker build --platform linux/amd64 --pull -f "${{ matrix.file }}" -t "$IMAGE:$TAG" "${{ matrix.context }}"

      # app and admin: start the image as it runs in production and request the
      # SPA. Catches images that build and scan fine but crash at start, for
      # example after a breaking update of express in serve/package.json. The Go
      # images need a database and config to start; go test covers their code.
      - name: Smoke test
        if: matrix.smoke-port
        run: |
          set -euo pipefail
          port="${{ matrix.smoke-port }}"
          docker run -d --name smoke -p "$port:$port" ${{ matrix.smoke-env }} "$IMAGE:$TAG"
          trap 'docker logs smoke; docker rm -f smoke > /dev/null' EXIT
          for route in / /config.json /some/deep/link; do
            curl -fsS -o /dev/null --retry 30 --retry-all-errors --retry-delay 1 "http://localhost:$port$route"
            echo "$route: ok"
          done

      - name: Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "$IMAGE:$TAG"

      - name: Save image
        if: env.PUBLISH == 'true'
        run: docker save "$IMAGE:$TAG" -o image.tar

      - name: Hand image to publish job
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    needs: [tag, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only this job gets the environment, so pull request runs never wait for
    # it or see its secrets.
    environment: dockerhub
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images

      - name: Load images
        run: for archive in images/*/image.tar; do docker load -i "$archive"; done

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # migrate last: Renovate looks up its tag, so it only finds builds whose
      # other four images are already on Docker Hub.
      - name: Push
        run: |
          set -euo pipefail
          for name in app admin auth api migrate; do
            image="omnifact/ssoready-$name:$TAG"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "::notice::$image already exists on Docker Hub, not overwriting it."
              continue
            fi
            docker push "$image"
            echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          done
