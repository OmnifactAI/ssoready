# Keeps everything that ships in the published images current. Merging an
# update triggers .github/workflows/images.yaml, which rebuilds, scans and
# publishes new images.
#
# Checks run daily, but each ecosystem is one grouped PR: new versions update
# the open PR instead of adding more. The cooldown skips releases younger than
# a few days, which avoids churn and gives the ecosystem time to catch a
# compromised release before we ship it.
version: 2
updates:
  # Base images (pinned by digest in the Dockerfiles).
  - package-ecosystem: docker
    directories:
      - /app
      - /admin
      - /cmd/auth
      - /cmd/api
      - /cmd/migrate
    schedule:
      interval: daily
    groups:
      base-images:
        patterns: ['*']

  # Runtime dependencies of the app and admin images (bin/serve-public).
  - package-ecosystem: npm
    directories:
      - /app/serve
      - /admin/serve
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      serve:
        patterns: ['*']

  # Go modules compiled into the auth, api and migrate binaries.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Actions rarely change and do not ship in the images.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
