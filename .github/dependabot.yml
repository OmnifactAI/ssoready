# Keeps everything that ships in the published images current. Merging an
# update triggers .github/workflows/images.yaml, which rebuilds, scans and
# publishes new images.
#
# Checks run daily, but each ecosystem is one grouped PR: new versions update
# the open PR instead of adding more. The cooldown skips releases younger than
# a few days, which avoids churn and gives the ecosystem time to catch a
# compromised release before we ship it.
#
# Major updates stay out of the groups and come as PRs of their own, so a
# breaking change (Express 5, a new Node major) gets a deliberate look instead
# of riding along with routine bumps.
version: 2
updates:
  # Base images (pinned by digest in docker/spa.Dockerfile and
  # docker/go.Dockerfile).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
    groups:
      base-images:
        patterns: ['*']
        update-types: [minor, patch]

  # Runtime dependencies of the app and admin images (bin/serve-public).
  - package-ecosystem: npm
    directories:
      - /app/serve
      - /admin/serve
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      serve:
        patterns: ['*']
        update-types: [minor, patch]

  # Go modules compiled into the auth, api and migrate binaries.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Actions rarely change and do not ship in the images.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
